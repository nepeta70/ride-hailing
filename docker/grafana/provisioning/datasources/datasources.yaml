apiVersion: 1

datasources:
  # 1. Prometheus (Metrics)
  - name: Prometheus
    type: prometheus
    uid: prometheus
    url: http://prometheus:9090
    isDefault: true # Makes this the default DB for new panels
    jsonData:
      httpMethod: POST
      exemplarsRepo:
        datasourceUid: tempo # Link metrics to traces via exemplars

  # 2. Tempo (Traces)
  - name: Tempo
    type: tempo
    uid: tempo
    url: http://tempo:3200
    jsonData:
      tracesToLogs:
        datasourceUid: loki
        tags: ['service.name', 'request.id']
        filterByTraceID: true
        filterBySpanID: true
      tracesToProfiles:
        datasourceUid: pyroscope
        tags: ['service.name'] # Matches Pyroscope's ApplicationName
        profileTypeId: 'process_cpu:cpu:nanoseconds:cpu:nanoseconds'
      tracesToMetrics:
        datasourceUid: prometheus
        tags: ['service.name']
        metricName: 'request_duration_seconds'
        metricValue: 'duration_seconds'
        exemplarTraceIDEnabled: true  

  # 3. Loki (Logs)
  - name: Loki
    type: loki
    uid: loki
    url: http://loki:3100
    jsonData:
      # This adds the "TraceID" button to your Log lines
      derivedFields:
        - datasourceUid: tempo
          matcherRegex: "trace_id=(\\w+)"
          name: TraceID
          url: "$${__value.raw}"

  # 4. Pyroscope (Profiles)
  - name: Pyroscope
    type: phlare # Grafana uses the 'phlare' plugin for Pyroscope
    uid: pyroscope
    url: http://pyroscope:4040
    jsonData:
      minStep: 10s
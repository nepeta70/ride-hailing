services:
  location:
    build:
      context: ..
      dockerfile: services/location/docker/Dockerfile
    ports:
      - "50051:50051"
    volumes:
      - ../services/location/cmd/config.json:/home/appuser/config/config.json:ro
    environment:
      - KAFKA_BROKERS=${KAFKA_BROKERS}
      - KAFKA_ADVERTISE_EXTERNAL=${KAFKA_ADVERTISE_EXTERNAL}
      - KAFKA_ADVERTISE_INTERNAL=${KAFKA_ADVERTISE_INTERNAL}
      - KAFKA_AUTO_CREATE_TOPICS=${KAFKA_AUTO_CREATE_TOPICS}
      - KAFKA_BATCH_SIZE=${KAFKA_BATCH_SIZE}
      - KAFKA_ENABLE_LOGGING=${KAFKA_ENABLE_LOGGING}
      - KAFKA_EXTERNAL_PORT=${KAFKA_EXTERNAL_PORT}
      - KAFKA_INTERNAL_PORT=${KAFKA_INTERNAL_PORT}
      - KAFKA_MEMORY=${KAFKA_MEMORY}
      - KAFKA_NODE_ID=${KAFKA_NODE_ID}
      - KAFKA_RESERVE_MEMORY=${KAFKA_RESERVE_MEMORY}
      - KAFKA_SMP=${KAFKA_SMP}
      - KAFKA_UI_BROKERS=${KAFKA_UI_BROKERS}
      - REDIS_ADDRESS=${REDIS_ADDRESS}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - SERVER_PORT=${LOCATION_SERVER_PORT}
      - API_KEY=${LOCATION_API_KEY}
      - HMAC_SECRET=${HMAC_SECRET}
      - PROMETHEUS_ADDRESS=${PROMETHEUS_ADDRESS}
      - OPENTELEMETRY_ADDRESS=${OPENTELEMETRY_ADDRESS}
      - TELEMETRY_INTERVAL_SECONDS=${TELEMETRY_INTERVAL_SECONDS}
      - LOG_LEVEL=${LOG_LEVEL}
    restart: always
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy    
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "${LOCATION_SERVER_PORT}"]
      interval: 5s
      timeout: 5s
      retries: 5

  ride:
    build:
      context: ..
      dockerfile: services/ride/docker/Dockerfile
    ports:
      - "50052:50052"
    volumes:
      - ../services/ride/cmd/config.json:/home/appuser/config/config.json:ro
    environment:
      - REDIS_ADDRESS=${REDIS_ADDRESS}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - SERVER_PORT=${RIDE_SERVER_PORT}
      - API_KEY=${RIDE_API_KEY}
      - HMAC_SECRET=${HMAC_SECRET}
      - PROMETHEUS_ADDRESS=${PROMETHEUS_ADDRESS}
      - OPENTELEMETRY_ADDRESS=${OPENTELEMETRY_ADDRESS}
      - TELEMETRY_INTERVAL_SECONDS=${TELEMETRY_INTERVAL_SECONDS}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      - KAFKA_BROKERS=${KAFKA_BROKERS}
      - KAFKA_ADVERTISE_EXTERNAL=${KAFKA_ADVERTISE_EXTERNAL}
      - KAFKA_ADVERTISE_INTERNAL=${KAFKA_ADVERTISE_INTERNAL}
      - KAFKA_AUTO_CREATE_TOPICS=${KAFKA_AUTO_CREATE_TOPICS}
      - KAFKA_BATCH_SIZE=${KAFKA_BATCH_SIZE}
      - KAFKA_ENABLE_LOGGING=${KAFKA_ENABLE_LOGGING}
      - KAFKA_EXTERNAL_PORT=${KAFKA_EXTERNAL_PORT}
      - KAFKA_INTERNAL_PORT=${KAFKA_INTERNAL_PORT}
      - KAFKA_MEMORY=${KAFKA_MEMORY}
      - KAFKA_NODE_ID=${KAFKA_NODE_ID}
      - KAFKA_RESERVE_MEMORY=${KAFKA_RESERVE_MEMORY}
      - KAFKA_SMP=${KAFKA_SMP}
      - KAFKA_UI_BROKERS=${KAFKA_UI_BROKERS}
      - LOG_LEVEL=${LOG_LEVEL}
    restart: always
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy  
      migrations:
        condition: service_completed_successfully   

  matching:
    build:
      context: ..
      dockerfile: services/matching/docker/Dockerfile
    ports:
      - "50053:50053"
    volumes:
      - ../services/matching/cmd/config.json:/home/appuser/config/config.json:ro
    environment:
      - SERVER_PORT=${MATCHING_SERVER_PORT}
      - API_KEY=${MATCHING_API_KEY}
      - HMAC_SECRET=${HMAC_SECRET}
      - PROMETHEUS_ADDRESS=${PROMETHEUS_ADDRESS}
      - OPENTELEMETRY_ADDRESS=${OPENTELEMETRY_ADDRESS}
      - TELEMETRY_INTERVAL_SECONDS=${TELEMETRY_INTERVAL_SECONDS}
      - KAFKA_BROKERS=${KAFKA_BROKERS}
      - KAFKA_ADVERTISE_EXTERNAL=${KAFKA_ADVERTISE_EXTERNAL}
      - KAFKA_ADVERTISE_INTERNAL=${KAFKA_ADVERTISE_INTERNAL}
      - KAFKA_AUTO_CREATE_TOPICS=${KAFKA_AUTO_CREATE_TOPICS}
      - KAFKA_BATCH_SIZE=${KAFKA_BATCH_SIZE}
      - KAFKA_ENABLE_LOGGING=${KAFKA_ENABLE_LOGGING}
      - KAFKA_EXTERNAL_PORT=${KAFKA_EXTERNAL_PORT}
      - KAFKA_INTERNAL_PORT=${KAFKA_INTERNAL_PORT}
      - KAFKA_MEMORY=${KAFKA_MEMORY}
      - KAFKA_NODE_ID=${KAFKA_NODE_ID}
      - KAFKA_RESERVE_MEMORY=${KAFKA_RESERVE_MEMORY}
      - KAFKA_SMP=${KAFKA_SMP}
      - KAFKA_UI_BROKERS=${KAFKA_UI_BROKERS}
      - LOG_LEVEL=${LOG_LEVEL}
      - LOCATION_SERVICE_ADDRESS=location:${LOCATION_SERVER_PORT}
      - LOCATION_SERVICE_API_KEY=${LOCATION_API_KEY}
      - SENDER_ID=${MATCHING_SENDER_ID}
      - GRPC_GO_LOG_SEVERITY_LEVEL=info
      - GRPC_GO_LOG_VERBOSITY_LEVEL=99
    restart: always
    depends_on:
      kafka:
        condition: service_healthy
      location:
        condition: service_healthy  

  user:
    build:
      context: ..
      dockerfile: services/user/docker/Dockerfile
    ports:
      - "50055:50055"
    volumes:
      - ../services/user/cmd/config.json:/home/appuser/config/config.json:ro
    environment:
      - SERVER_PORT=${USER_SERVER_PORT:-50055}
      - API_KEY=${USER_API_KEY}
      - HMAC_SECRET=${HMAC_SECRET}
      - PROMETHEUS_ADDRESS=${PROMETHEUS_ADDRESS}
      - OPENTELEMETRY_ADDRESS=${OPENTELEMETRY_ADDRESS}
      - TELEMETRY_INTERVAL_SECONDS=${TELEMETRY_INTERVAL_SECONDS}
      - LOG_LEVEL=${LOG_LEVEL}
      - REDIS_ADDRESS=${REDIS_ADDRESS}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - KAFKA_BROKERS=${KAFKA_BROKERS}
      - KAFKA_ADVERTISE_EXTERNAL=${KAFKA_ADVERTISE_EXTERNAL}
      - KAFKA_ADVERTISE_INTERNAL=${KAFKA_ADVERTISE_INTERNAL}
      - KAFKA_AUTO_CREATE_TOPICS=${KAFKA_AUTO_CREATE_TOPICS}
      - KAFKA_BATCH_SIZE=${KAFKA_BATCH_SIZE}
      - KAFKA_ENABLE_LOGGING=${KAFKA_ENABLE_LOGGING}
      - KAFKA_EXTERNAL_PORT=${KAFKA_EXTERNAL_PORT}
      - KAFKA_INTERNAL_PORT=${KAFKA_INTERNAL_PORT}
      - KAFKA_MEMORY=${KAFKA_MEMORY}
      - KAFKA_NODE_ID=${KAFKA_NODE_ID}
      - KAFKA_RESERVE_MEMORY=${KAFKA_RESERVE_MEMORY}
      - KAFKA_SMP=${KAFKA_SMP}
      - KAFKA_UI_BROKERS=${KAFKA_UI_BROKERS}
    restart: always
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "${USER_SERVER_PORT:-50055}"]
      interval: 5s
      timeout: 5s
      retries: 5
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy  
      migrations:
        condition: service_completed_successfully     

  driver:
    build:
      context: ..
      dockerfile: services/driver/docker/Dockerfile
    ports:
      - "50054:50054"
    volumes:
      - ../services/driver/cmd/config.json:/home/appuser/config/config.json:ro
    environment:
      - SERVER_PORT=${DRIVER_SERVER_PORT}
      - API_KEY=${DRIVER_API_KEY}
      - HMAC_SECRET=${HMAC_SECRET}
      - PROMETHEUS_ADDRESS=${PROMETHEUS_ADDRESS}
      - OPENTELEMETRY_ADDRESS=${OPENTELEMETRY_ADDRESS}
      - TELEMETRY_INTERVAL_SECONDS=${TELEMETRY_INTERVAL_SECONDS}
      - KAFKA_BROKERS=${KAFKA_BROKERS}
      - KAFKA_ADVERTISE_EXTERNAL=${KAFKA_ADVERTISE_EXTERNAL}
      - KAFKA_ADVERTISE_INTERNAL=${KAFKA_ADVERTISE_INTERNAL}
      - KAFKA_AUTO_CREATE_TOPICS=${KAFKA_AUTO_CREATE_TOPICS}
      - KAFKA_BATCH_SIZE=${KAFKA_BATCH_SIZE}
      - KAFKA_ENABLE_LOGGING=${KAFKA_ENABLE_LOGGING}
      - KAFKA_EXTERNAL_PORT=${KAFKA_EXTERNAL_PORT}
      - KAFKA_INTERNAL_PORT=${KAFKA_INTERNAL_PORT}
      - KAFKA_MEMORY=${KAFKA_MEMORY}
      - KAFKA_NODE_ID=${KAFKA_NODE_ID}
      - KAFKA_RESERVE_MEMORY=${KAFKA_RESERVE_MEMORY}
      - KAFKA_SMP=${KAFKA_SMP}
      - KAFKA_UI_BROKERS=${KAFKA_UI_BROKERS}
      - LOG_LEVEL=${LOG_LEVEL}
      - MONGO_DB=${MONGO_DB}
      - MONGO_HOST=${MONGO_HOST}
      - MONGO_PORT=${MONGO_PORT}
      - MONGO_USER=${MONGO_USER}
      - MONGO_PASSWORD=${MONGO_PASSWORD}

    restart: always
    depends_on:
      kafka:
        condition: service_healthy
      mongodb:
        condition: service_healthy

  gateway:
    build:
      context: ..
      dockerfile: gateway/docker/Dockerfile
    volumes:
      - ../gateway/cmd/config.json:/home/appuser/config.json:ro
    environment:
      - SERVER_PORT=${GATEWAY_SERVER_PORT:-5000}
      - SERVER_HOST=0.0.0.0
      - PROMETHEUS_ADDRESS=${PROMETHEUS_ADDRESS}
      - OPENTELEMETRY_ADDRESS=${OPENTELEMETRY_ADDRESS}
      - TELEMETRY_INTERVAL_SECONDS=${TELEMETRY_INTERVAL_SECONDS}
      - LOG_LEVEL=${LOG_LEVEL}
      - HMAC_SECRET=${HMAC_SECRET}
      - RIDE_SERVICE_ADDRESS=ride:${RIDE_SERVER_PORT}
      - RIDE_SERVICE_API_KEY=${RIDE_API_KEY}
      - USER_SERVICE_ADDRESS=user:${USER_SERVER_PORT:-50055}
      - USER_SERVICE_API_KEY=${USER_API_KEY}
      - DRIVER_SERVICE_ADDRESS=driver:${DRIVER_SERVER_PORT}
      - DRIVER_SERVICE_API_KEY=${DRIVER_API_KEY}
      - LOCATION_SERVICE_ADDRESS=location:${LOCATION_SERVER_PORT}
      - LOCATION_SERVICE_API_KEY=${LOCATION_API_KEY}
    restart: always
    depends_on:
      ride:
        condition: service_started
      location:
        condition: service_healthy
      driver:
        condition: service_started
      user:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "5000"]
      interval: 10s
      timeout: 5s
      retries: 5

include:
  - path: docker-compose.infra.yaml
  - path: docker-compose.telemetry.yaml
  - path: docker-compose.gateway.yaml
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318  
  filelog:
    include: [ "/var/lib/docker/containers/*/*-json.log" ]
    operators:
      - type: json_parser
        timestamp:
          parse_from: attributes.time
          layout: '%Y-%m-%dT%H:%M:%S.%LZ'      

exporters:
  prometheus:
    endpoint: "0.0.0.0:8889"
    enable_open_metrics: true
    resource_to_telemetry_conversion:
      enabled: true
      
  otlphttp/loki:
    endpoint: "http://loki:3100/otlp"
    tls:
      insecure: true  
  otlphttp/tempo:
    endpoint: "http://tempo:4318"
    tls: { insecure: true }
  otlphttp/pyroscope:
    endpoint: "http://pyroscope:4040/otlp"
    tls: { insecure: true }

processors:
  batch:
    send_batch_size: 8192
    timeout: 1s
  resource:
    attributes:
      - key: service.name
        action: upsert
        from_attribute: service.name
  attributes:
    actions:
      - key: job
        from_attribute: service.name
        action: upsert
  transform:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          # Step 1: Combine the method and full URL into the span name
          - set(name, Concat([" ", attributes["http.method"], " ", attributes["http.url"]], "")) where name == "kong" and attributes["http.url"] != nil
          
          # Step 2: Strip the domain/protocol in-place directly from the name field (lowercase editor)
          - replace_pattern(name, "^https?://[^/]+", "") where attributes["http.url"] != nil
          
          # Step 3: Fallback if http.url is completely missing
          - set(name, Concat([" ", attributes["http.method"], " ", attributes["http.route"]], "")) where name == "kong" and attributes["http.url"] == nil and attributes["http.route"] != nil
service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [resource]
      exporters: [prometheus]
    logs:
      receivers: [otlp, filelog]
      processors: [resource, attributes]
      exporters: [otlphttp/loki]      
    traces:
      receivers: [otlp]
      processors: [resource, attributes, transform, batch]
      exporters: [otlphttp/tempo]
    profiles:
      receivers: [otlp]
      processors: [resource]
      exporters: [otlphttp/pyroscope]    
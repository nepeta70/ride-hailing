server:  
  http_listen_port: 3200  
  grpc_listen_port: 9095  

distributor:  
  receivers:  
    otlp:  
      protocols:  
        grpc:  
          endpoint: 0.0.0.0:4317  
        http:  
          endpoint: 0.0.0.0:4318  
  ring:  
    kvstore:  
      store: inmemory  

querier:  
  frontend_worker:  
    frontend_address: tempo:9095  

query_frontend:  
  search: {}  
  trace_by_id: {}  

ingester:  
  lifecycler:  
    ring:  
      kvstore:  
        store: inmemory  
      replication_factor: 1  

storage:  
  trace:  
    backend: local  
    local:  
      path: /var/tempo/blocks  
    wal:  
      path: /var/tempo/wal  

metrics_generator:  
  registry:  
    external_labels:  
      source: tempo  
  storage:  
    path: /var/tempo/generator/wal  
    remote_write:  
      - url: http://prometheus:9090/api/v1/write  
        send_exemplars: true  
  ring:  
    kvstore:  
      store: inmemory  
  processor:
    local_blocks:
      filter_server_spans: false 
      flush_to_storage: false

overrides:  
  defaults:  
    metrics_generator:  
      processors: [service-graphs, span-metrics, local-blocks]  
syntax = "proto3";

package user.v1;

import "google/protobuf/empty.proto";

option go_package = "github.com/nepeta70/ride-hailing/gen/pb/user/v1";

service UserService {
  // rpc methods go here
  rpc GetUser(GetUserRequest) returns (User);
  rpc RegisterUser(RegisterUserRequest) returns (RegisterUserResponse);
  rpc UpdateUser(UpdateUserRequest) returns (User);
}

message GetUserRequest {
  string user_id = 1;
}

message RegisterUserRequest {
  string user_type = 1;
  string email = 2;
  string phone_number = 3;
  string password = 4;
}

message UpdateUserRequest {
  string user_id = 1;
  string user_name = 2;
  string first_name = 3;
  string last_name = 4;
}

message User {
  string user_id = 1;
  string user_name = 2;
  string user_type = 3;
  string first_name = 4;
  string last_name = 5;
  string email = 6;
  string phone_number = 7;
}

message RegisterUserResponse {
  string user_id = 1;
}

syntax = "proto3";

package matching.v1;

import "google/protobuf/empty.proto";

option go_package = "github.com/nepeta70/ride-hailing/gen/pb/matching/v1";

service MatchingService {
  rpc FindMatchingDrivers(MatchingRequest) returns (MatchingResponse);
}

message MatchingRequest {
  string ride_id = 1;
}
message MatchingResponse {
  string ride_id = 1;
  string driver_id = 2;
}
